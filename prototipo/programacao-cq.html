<title>Programação CQ</title>
<meta name="description" content="Protótipo do app de programação de lotes do CQ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de tablet no estilo Power Apps. Barra superior com data e turno, trilho de navegação à esquerda, área de trabalho à direita. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --surface-2: #f6f8f8;
  --ink: #14201d;
  --ink-2: #4f5f5b;
  --ink-3: #7b8a86;
  --line: #d6dfdc;
  --accent: #0d6b62;
  --accent-ink: #ffffff;
  --accent-soft: #dcefec;
  --t1: #e0a800; --t1-soft: #fff4cc;
  --t2: #2f6fdb; --t2-soft: #e1ebfb;
  --t3: #e07a1f; --t3-soft: #fde9d6;
  --ok: #1b7f3b; --ok-soft: #dff3e5;
  --wait: #1f3a5c; --wait-soft: #e3e9f1;
  --prep: #9a6a00; --prep-soft: #fcefc9;
  --run: #6f6a00; --run-soft: #f1f0c4;
  --conf: #6a3fa0; --conf-soft: #ece3f7;
  --dev: #c0322f; --dev-soft: #fbe2e1;
  --oth: #5f6b68; --oth-soft: #e8ecea;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --shadow: 0 1px 2px rgb(20 32 29 / 8%), 0 4px 16px rgb(20 32 29 / 6%);
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #172020; --surface-2: #1d2827; --ink: #e8efed; --ink-2: #aebcb8; --ink-3: #82928e;
    --line: #2c3a38; --accent: #3fb3a6; --accent-ink: #06201d; --accent-soft: #173a36;
    --t1: #f0c030; --t1-soft: #3a3210; --t2: #6b9cf0; --t2-soft: #182a48; --t3: #f0a060; --t3-soft: #3d2612;
    --ok: #5cc97f; --ok-soft: #173524; --wait: #a9c1e0; --wait-soft: #1c2a3b; --prep: #e8b94a; --prep-soft: #3a2e0f;
    --run: #d6cf5a; --run-soft: #33310f; --conf: #bb9be8; --conf-soft: #2d2140; --dev: #f07a76; --dev-soft: #3f1c1b;
    --oth: #a3b0ad; --oth-soft: #253130; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 4px 16px rgb(0 0 0 / 30%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #172020; --surface-2: #1d2827; --ink: #e8efed; --ink-2: #aebcb8; --ink-3: #82928e;
  --line: #2c3a38; --accent: #3fb3a6; --accent-ink: #06201d; --accent-soft: #173a36;
  --t1: #f0c030; --t1-soft: #3a3210; --t2: #6b9cf0; --t2-soft: #182a48; --t3: #f0a060; --t3-soft: #3d2612;
  --ok: #5cc97f; --ok-soft: #173524; --wait: #a9c1e0; --wait-soft: #1c2a3b; --prep: #e8b94a; --prep-soft: #3a2e0f;
  --run: #d6cf5a; --run-soft: #33310f; --conf: #bb9be8; --conf-soft: #2d2140; --dev: #f07a76; --dev-soft: #3f1c1b;
  --oth: #a3b0ad; --oth-soft: #253130; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 4px 16px rgb(0 0 0 / 30%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }

/* ---------- casca ---------- */
.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-size: 17px; letter-spacing: -0.01em; }
.brand span { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl label { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
input[type="date"], select, input[type="search"], input[type="text"], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 34px;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.tdot.t1 { background: var(--t1); } .tdot.t2 { background: var(--t2); } .tdot.t3 { background: var(--t3); }

.nav { background: var(--surface); border-right: 1px solid var(--line); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; color: var(--ink-2); font-weight: 500; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .count { font-family: var(--mono); font-size: 12px; background: var(--surface-2); color: var(--ink-2); border-radius: 10px; padding: 1px 7px; }
.nav .sep { height: 1px; background: var(--line); margin: 10px 4px; }
.nav .note { font-size: 12px; color: var(--ink-3); padding: 4px 12px; line-height: 1.5; }
.nav .note button { display: inline; padding: 0; color: var(--accent); background: none; text-decoration: underline; font-size: 12px; }

.main { overflow: auto; padding: 16px; min-width: 0; }
.screen-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }
.screen-head h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.screen-head p { margin: 0; color: var(--ink-2); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; min-height: 34px; font-weight: 500; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.small { min-height: 28px; padding: 3px 9px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }

/* ---------- fila ---------- */
.fam-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
.fam-tabs button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 5px 12px; display: inline-flex; gap: 8px; align-items: center; }
.fam-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.fam-tabs .n { font-family: var(--mono); font-size: 12px; opacity: 0.75; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
.filters input[type="search"] { width: 220px; max-width: 100%; }
.check { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }

.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.queue { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grupo { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.grupo-head { padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.grupo-head h2 { font-size: 14px; margin: 0; }
.grupo-head .pad { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; width: 100%; }
.grupo-head .pad > span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); margin-right: 4px; }
.lote { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 8px 14px; padding: 10px 12px; border-top: 1px solid var(--line); }
.lote:first-of-type { border-top: 0; }
.lote.done { opacity: 0.6; }
.lote-id { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lote-id .l1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lote-id .num { font-family: var(--mono); font-weight: 500; font-size: 14px; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.lote-id .prod { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.lote-id .meta { font-size: 12px; color: var(--ink-3); display: flex; gap: 10px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 5px; border: 1px solid var(--line); color: var(--ink-2); letter-spacing: 0.03em; }
.cl { font-size: 11px; font-weight: 600; border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
.cl.dde { background: var(--dev-soft); color: var(--dev); }
.cl.pv { background: var(--t3-soft); color: var(--t3); }
.cl.est { background: var(--prep-soft); color: var(--prep); }
.cl.ok { background: var(--ok-soft); color: var(--ok); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.chip { position: relative; display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 104px; max-width: 190px; padding: 5px 9px 5px 10px; border-radius: 7px; border: 1px solid transparent; text-align: left; line-height: 1.2; }
.chip .tn { font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
.chip .ts { font-size: 11px; opacity: 0.9; }
.chip[disabled] { cursor: default; }
.chip.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.chip .badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; border-radius: 9px; font-size: 11px; font-weight: 700; display: grid; place-items: center; color: #1a1a1a; border: 2px solid var(--surface); padding: 0 4px; }
.badge.t1 { background: var(--t1); } .badge.t2 { background: var(--t2); color: #fff; } .badge.t3 { background: var(--t3); }
.st-ok { background: var(--ok-soft); color: var(--ok); }
.st-wait { background: var(--wait-soft); color: var(--wait); }
.st-prep { background: var(--prep-soft); color: var(--prep); }
.st-run { background: var(--run-soft); color: var(--run); }
.st-conf { background: var(--conf-soft); color: var(--conf); }
.st-dev { background: var(--dev-soft); color: var(--dev); }
.st-oth { background: var(--oth-soft); color: var(--oth); }
.chip:not([disabled]):hover { border-color: currentColor; }
.more { padding: 10px 12px; border-top: 1px solid var(--line); }

/* painel lateral de programação */
.side { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.card .sub { margin: 0 0 12px; color: var(--ink-2); font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field label { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.field select, .field input, .field textarea { width: 100%; }
.sel-list { list-style: none; margin: 0 0 12px; padding: 0; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.sel-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; border-top: 1px solid var(--line); font-size: 13px; }
.sel-list li:first-child { border-top: 0; }
.sel-list .x { border: 0; background: none; color: var(--ink-3); font-size: 16px; line-height: 1; padding: 2px 6px; }
.empty { padding: 14px; text-align: center; color: var(--ink-3); font-size: 13px; }
.load { display: flex; flex-direction: column; gap: 6px; }
.load-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 13px; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; grid-column: 1 / -1; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }

/* ---------- quadro ---------- */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.col-head { padding: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.col-head.t1 { border-top: 4px solid var(--t1); } .col-head.t2 { border-top: 4px solid var(--t2); } .col-head.t3 { border-top: 4px solid var(--t3); }
.col-head h2 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.ana { padding: 10px 12px; border-top: 1px solid var(--line); }
.ana:first-of-type { border-top: 0; }
.ana h4 { margin: 0 0 6px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.it { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 13px; border-top: 1px dashed var(--line); }
.it:first-of-type { border-top: 0; }
.it .what { min-width: 0; overflow-wrap: anywhere; }
.it .what small { display: block; color: var(--ink-3); font-size: 11px; }
.ret { font-size: 11px; font-weight: 600; border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
.ret.feito { background: var(--ok-soft); color: var(--ok); }
.ret.cont { background: var(--t2-soft); color: var(--t2); }
.ret.nao { background: var(--dev-soft); color: var(--dev); }
.ret.pend { background: var(--oth-soft); color: var(--oth); }

/* ---------- meu turno ---------- */
.mine { display: flex; flex-direction: column; gap: 10px; max-width: 860px; }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; }
.task h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.task .d { font-size: 13px; color: var(--ink-2); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.acts .b-feito { border-color: var(--ok); color: var(--ok); }
.acts .b-cont { border-color: var(--t2); color: var(--t2); }
.acts .b-nao { border-color: var(--dev); color: var(--dev); }
.acts .on.b-feito { background: var(--ok); color: var(--surface); }
.acts .on.b-cont { background: var(--t2); color: var(--surface); }
.acts .on.b-nao { background: var(--dev); color: var(--surface); }
.task .extra { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }

/* ---------- passagem / tabelas ---------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); background: var(--surface-2); border-top: 0; white-space: nowrap; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.recado { padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.recado:first-child { border-top: 0; }
.recado small { color: var(--ink-3); display: block; }

/* ---------- painel ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi .v { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .k { font-size: 12px; color: var(--ink-2); }
.viz { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.viz h3 { margin: 0 0 4px; font-size: 15px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin: 6px 0 12px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: -1px; }
.hbar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 48px; gap: 10px; align-items: center; padding: 4px 0; font-size: 13px; }
.hbar .track { display: flex; gap: 2px; height: 14px; }
.hbar .track span { display: block; height: 100%; min-width: 2px; }
.hbar .track span:first-child { border-radius: 4px 0 0 4px; }
.hbar .track span:last-child { border-radius: 0 4px 4px 0; }
.hbar .track span:only-child { border-radius: 4px; }
.hbar .tot { text-align: right; font-family: var(--mono); color: var(--ink-2); }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; padding: 6px 8px; border-radius: 6px; z-index: 50; max-width: 260px; }

/* ---------- gaveta do lote ---------- */
.drawer-bg { position: fixed; inset: 0; background: rgb(0 0 0 / 30%); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); z-index: 21; overflow: auto; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); border-left: 1px solid var(--line); }
.drawer h2 { margin: 0 0 2px; font-family: var(--mono); font-size: 20px; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; margin: 14px 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 8px; z-index: 60; font-size: 13px; box-shadow: var(--shadow); }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 8px; line-height: 1.5; }

@media (max-width: 1100px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; order: -1; }
  .board { grid-template-columns: minmax(0, 1fr); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
  .nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px 8px; }
  .nav button { flex: none; }
  .nav .sep, .nav .note { display: none; }
  .lote { grid-template-columns: minmax(0, 1fr); }
  .task { grid-template-columns: minmax(0, 1fr); }
  .acts { justify-content: flex-start; }
  .hbar { grid-template-columns: 96px minmax(0, 1fr) 40px; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide 0.18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><b>Programação CQ</b><span>protótipo</span></div>
    <div class="ctl"><label for="f-data">Data</label><input type="date" id="f-data"></div>
    <div class="ctl"><label>Turno</label><div class="seg" id="f-turno" role="group" aria-label="Turno"></div></div>
  </header>
  <nav class="nav" id="nav" aria-label="Telas"></nav>
  <main class="main" id="main"></main>
</div>

/* ---------- constantes ---------- */
const TELAS = [
  ["programar", "Programar"],
  ["quadro", "Quadro dos turnos"],
  ["meu", "Meu turno"],
  ["passagem", "Passagem de turno"],
  ["equip", "Equipamentos"],
  ["painel", "Painel"],
];
const CONCLUIDO = new Set(DATA.concluidos);
const STATUS_OPCOES = ["AG. ANÁLISE", "EM PREPARO", "HPLC", "CG", "AG. LEITURA", "AG. CONFERÊNCIA", "APROVADO",
  "FDE FASE 1A", "FDE FASE 1B", "INVESTIGAÇÃO", "FEITO NO PI - OK", "N/A"];
const MOTIVOS = ["Sem amostra", "Padrão/FM não pronto", "Equipamento indisponível", "Sem tempo no turno", "Prioridade mudou", "Falta de analista", "Outro"];
const CLUSTERS = { "Crítico DDE": ["dde", 0], "Crítico PV": ["pv", 1], "Estq Interno Abaixo": ["est", 2], "Ok": ["ok", 3], "OK": ["ok", 3] };
const RET_CLS = { "Feito": "feito", "Continuidade": "cont", "Não feito": "nao" };
const FAM = Object.fromEntries(DATA.familias.map(f => [f.id, f.nome]));
const CHAVE = "cq-programacao-prototipo-v1";

/* ---------- estado ---------- */
let S = carregar();
const UI = { tela: "programar", fam: "tor", busca: "", cluster: "", verConcluidos: false, sel: new Set(), analistaMeu: "", famQuadro: "", famEquip: "", limite: {} };

function estadoInicial() {
  const itens = DATA.itens.map((it, i) => ({
    id: i + 1, data: DATA.gerado, turno: it.turno, tipo: it.tipo, ref: it.ref,
    analista: "", equip: "", ret: it.ret, motivo: "", origem: "planilha",
  }));
  return { data: DATA.gerado, turno: 1, itens, status: {}, recados: [
    { id: 1, data: DATA.gerado, turno: 1, fam: "dip", texto: "Exemplo de recado: pendência aos cuidados do 2º turno (hoje isso fica em comentários nas células).", quem: "Exemplo" },
  ], prox: DATA.itens.length + 1 };
}
function carregar() {
  try { const s = JSON.parse(localStorage.getItem(CHAVE)); if (s && s.itens) return s; } catch (e) {}
  return estadoInicial();
}
function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch (e) {} }

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtData = iso => { if (!iso) return ""; const [y, m, d] = iso.slice(0, 10).split("-"); return d ? `${d}/${m}/${y}` : iso; };
function addDias(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function proximo(data, t) { return t < 3 ? [data, t + 1] : [addDias(data, 1), 1]; }
function anterior(data, t) { return t > 1 ? [data, t - 1] : [addDias(data, -1), 3]; }
function stClasse(s) {
  if (CONCLUIDO.has(s) || s === "APROVADO") return "ok";
  if (s === "AG. ANÁLISE") return "wait";
  if (s === "EM PREPARO") return "prep";
  if (["HPLC", "CG", "AG. LEITURA"].includes(s)) return "run";
  if (s.startsWith("AG. CONF") || s.startsWith("AG. APROV")) return "conf";
  if (s.startsWith("FDE") || s.includes("INVESTIGA") || s === "ROA" || s.startsWith("RO ") || s.includes("LAUDOS")) return "dev";
  return "oth";
}
function clusterInfo(c) { return CLUSTERS[c] || null; }
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* referências: análise "a{lote}-{i}" ou preparo "p|{grupo}|{teste}" */
function statusDe(ref) {
  if (S.status[ref]) return S.status[ref];
  if (ref.startsWith("p|")) { const [, g, t] = ref.split("|"); return DATA.grupos[g]?.p[t] || "AG. ANÁLISE"; }
  const [l, i] = ref.slice(1).split("-").map(Number); return DATA.lotes[l].a[i][1];
}
function descr(ref) {
  if (ref.startsWith("p|")) {
    const [, g, t] = ref.split("|"); const gr = DATA.grupos[g];
    return { titulo: `Padrão/FM · ${t}`, sub: gr?.nome || g, fam: gr?.f, lote: null };
  }
  const [l, i] = ref.slice(1).split("-").map(Number); const lo = DATA.lotes[l];
  return { titulo: `${lo.lote} · ${lo.a[i][0]}`, sub: lo.prod, fam: lo.f, lote: lo };
}
function concluido(ref) { return CONCLUIDO.has(statusDe(ref)); }
function itensDo(data, turno) { return S.itens.filter(it => it.data === data && (turno == null || it.turno === turno)); }
function progMapa() {
  const m = {};
  for (const it of S.itens) if (it.data === S.data && it.ret !== "Feito" && it.ret !== "Não feito") (m[it.ref] ||= new Set()).add(it.turno);
  return m;
}
function lotePendente(lo) { return lo.a.some((_, i) => !concluido(`a${lo.id}-${i}`)); }
function analistasDoTurno(t) { return DATA.analistas.filter(a => a.turno === t); }

/* ---------- casca ---------- */
function renderTopo() {
  $("#f-data").value = S.data;
  $("#f-turno").innerHTML = [1, 2, 3].map(t =>
    `<button type="button" data-turno="${t}" aria-pressed="${S.turno === t}"><i class="tdot t${t}"></i>${t}º</button>`).join("");
  const pendTurno = itensDo(S.data, S.turno).filter(i => !i.ret).length;
  $("#nav").innerHTML = TELAS.map(([id, nome]) => {
    const c = id === "meu" ? pendTurno : id === "passagem" ? passagemContagem() : null;
    return `<button type="button" data-tela="${id}" ${UI.tela === id ? 'aria-current="page"' : ""}>${nome}${c ? `<span class="count">${c}</span>` : ""}</button>`;
  }).join("") + `<div class="sep"></div>
    <div class="note">Dados da planilha Status + Programação V0 (${fmtData(DATA.gerado)}). O que você fizer fica salvo só neste navegador.
    <br><button type="button" data-acao="reset">Voltar aos dados da planilha</button></div>`;
}
function render() {
  renderTopo();
  const f = { programar: telaProgramar, quadro: telaQuadro, meu: telaMeu, passagem: telaPassagem, equip: telaEquip, painel: telaPainel }[UI.tela];
  $("#main").innerHTML = f();
}

/* ---------- tela: programar ---------- */
function chip(ref, teste, status, pm) {
  const done = CONCLUIDO.has(status);
  const tur = pm[ref] ? [...pm[ref]].sort() : [];
  const sel = UI.sel.has(ref);
  return `<button type="button" class="chip st-${stClasse(status)}${sel ? " sel" : ""}" data-chip="${esc(ref)}" ${done ? "disabled" : ""}
    aria-pressed="${sel}" title="${esc(teste)}: ${esc(status)}${tur.length ? ` · programado ${tur.map(t => t + "º").join(", ")} turno` : ""}">
    <span class="tn">${esc(teste)}</span><span class="ts">${esc(status.toLowerCase())}</span>
    ${tur.length ? `<span class="badge t${tur[0]}">${tur.join("·")}</span>` : ""}</button>`;
}
function telaProgramar() {
  const pm = progMapa();
  const busca = UI.busca.trim().toLowerCase();
  const contagem = {};
  for (const lo of DATA.lotes) if (lotePendente(lo)) contagem[lo.f] = (contagem[lo.f] || 0) + 1;
  const tabs = DATA.familias.filter(f => contagem[f.id] || DATA.lotes.some(l => l.f === f.id)).map(f =>
    `<button type="button" data-fam="${f.id}" aria-pressed="${UI.fam === f.id}">${esc(f.nome)}<span class="n">${contagem[f.id] || 0}</span></button>`).join("");

  // lotes da família, filtrados
  const porGrupo = {};
  for (const lo of DATA.lotes) {
    if (lo.f !== UI.fam) continue;
    const pend = lotePendente(lo);
    if (!pend && !UI.verConcluidos) continue;
    if (UI.cluster && (clusterInfo(lo.cl)?.[0] || "none") !== UI.cluster) continue;
    if (busca && !(`${lo.lote} ${lo.pi} ${lo.prod} ${lo.cod}`.toLowerCase().includes(busca))) continue;
    (porGrupo[lo.g] ||= []).push(lo);
  }
  const rank = lo => (clusterInfo(lo.cl)?.[1] ?? 4) * 10000 - (Number(lo.dias) || 0);
  const grupos = Object.entries(porGrupo).map(([g, ls]) => [g, ls.sort((a, b) => rank(a) - rank(b))])
    .sort((a, b) => rank(a[1][0]) - rank(b[1][0]));

  const limite = UI.limite[UI.fam] || 25;
  const html = grupos.slice(0, limite).map(([g, ls]) => {
    const gr = DATA.grupos[g];
    const pad = gr.t.map(t => chip(`p|${g}|${t}`, t, statusDe(`p|${g}|${t}`), pm)).join("");
    return `<section class="grupo"><div class="grupo-head"><h2>${esc(gr.nome)}</h2>
      <span class="faint">${ls.length} lote${ls.length > 1 ? "s" : ""}</span>
      <div class="pad"><span>Padrão / FM</span>${pad}</div></div>
      ${ls.map(lo => {
        const ci = clusterInfo(lo.cl);
        return `<div class="lote${lotePendente(lo) ? "" : " done"}"><div class="lote-id">
          <div class="l1"><button type="button" class="num" data-lote="${lo.id}">${esc(lo.lote)}</button>
          <span class="tag">${lo.tipo}</span>${ci ? `<span class="cl ${ci[0]}">${esc(lo.cl)}</span>` : ""}</div>
          <div class="prod">${esc(lo.prod)}</div>
          <div class="meta">${lo.dias !== "" ? `<span>${esc(lo.dias)} dias no CQ</span>` : ""}${lo.lib && /^\d{4}-/.test(lo.lib) ? `<span>lib ${fmtData(lo.lib)}</span>` : lo.lib ? `<span>${esc(lo.lib)}</span>` : ""}${lo.tipo === "PA" && lo.pi ? `<span>PI ${esc(lo.pi)}</span>` : ""}</div>
        </div><div class="chips">${lo.a.map(([t, s], i) => chip(`a${lo.id}-${i}`, t, statusDe(`a${lo.id}-${i}`), pm)).join("") || '<span class="faint">sem testes</span>'}</div></div>`;
      }).join("")}</section>`;
  }).join("");
  const resto = grupos.length - limite;

  return `<div class="screen-head"><h1>Fila e programação</h1>
      <p>Toque nos testes para selecionar e programe para o ${S.turno}º turno de ${fmtData(S.data)}. Ordem: cluster crítico primeiro, depois mais dias no CQ.</p></div>
    <div class="fam-tabs" role="group" aria-label="Família">${tabs}</div>
    <div class="filters">
      <input type="search" id="f-busca" placeholder="Buscar lote, PI ou produto" value="${esc(UI.busca)}" aria-label="Buscar">
      <select id="f-cluster" aria-label="Cluster">
        ${[["", "Todos os clusters"], ["dde", "Crítico DDE"], ["pv", "Crítico PV"], ["est", "Estq Interno Abaixo"], ["ok", "Ok"], ["none", "Sem cluster"]]
          .map(([v, n]) => `<option value="${v}" ${UI.cluster === v ? "selected" : ""}>${n}</option>`).join("")}
      </select>
      <label class="check"><input type="checkbox" id="f-conc" ${UI.verConcluidos ? "checked" : ""}> Mostrar lotes concluídos</label>

/* ---------- tela: quadro ---------- */

}
function telaQuadro() {

/* ---------- tela: meu turno ---------- */

/* ---------- tela: equipamentos ---------- */
function telaEquip() {
  const eqs = DATA.equipamentos.filter(e => e.tag && e.tag !== "-" && (!UI.famEquip || e.fam_txt === UI.famEquip));
  const fams = [...new Set(DATA.equipamentos.map(e => e.fam_txt).filter(f => f && f !== "-"))];
  const base = new Date(DATA.gerado + "T12:00:00");
  const agora = new Set(itensDo(S.data, S.turno).map(i => i.equip).filter(Boolean));
  const calib = c => {
    if (!/^\d{4}-/.test(c)) return `<span class="faint">${esc(c || "—")}</span>`;
    const dias = Math.round((new Date(c.slice(0, 10) + "T12:00:00") - base) / 864e5);
    const cls = dias < 0 ? "nao" : dias <= 60 ? "cont" : "feito";
    return `<span class="ret ${cls}">${fmtData(c)}</span> <span class="faint">${dias < 0 ? "vencida" : dias <= 60 ? `vence em ${dias} d` : ""}</span>`;
  };
  const term = v => /^\d{4}-\d{2}-\d{2} /.test(v) ? `${fmtData(v)} ${v.slice(11, 16)}` : esc(v);
  return `<div class="screen-head"><h1>Equipamentos</h1><p>Quadro dos cromatógrafos: o que está rodando, quando termina e o próximo da fila.</p></div>
    <div class="filters"><select id="f-fame" aria-label="Grupo"><option value="">Todos os grupos</option>${fams.map(f => `<option ${UI.famEquip === f ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>

/* ---------- tela: painel ---------- */
function grupoStatus(s) {
  const c = stClasse(s);
  return c === "wait" || c === "oth" ? 0 : c === "dev" ? 2 : 1;
}
function telaPainel() {
  let pend = 0, lotesFila = 0, criticos = 0;
  const porFam = {};
  for (const lo of DATA.lotes) {
    let p = 0;
    lo.a.forEach((_, i) => {
      const r = `a${lo.id}-${i}`, s = statusDe(r);
      if (CONCLUIDO.has(s)) return;
      p++; pend++;
      (porFam[lo.f] ||= [0, 0, 0])[grupoStatus(s)]++;
    });
    if (p) { lotesFila++; if ((clusterInfo(lo.cl)?.[1] ?? 9) <= 1) criticos++; }
  }
  const hoje = itensDo(S.data);
  const comRet = hoje.filter(i => i.ret), feito = hoje.filter(i => i.ret === "Feito").length;
  const motivos = {};
  for (const it of S.itens) if (it.ret === "Não feito") motivos[it.motivo || "Não informado"] = (motivos[it.motivo || "Não informado"] || 0) + 1;
  const max = Math.max(1, ...Object.values(porFam).map(v => v[0] + v[1] + v[2]));
  const nomes = ["Aguardando análise", "Em andamento", "Desvio / investigação"];
  const barras = DATA.familias.filter(f => porFam[f.id]).sort((a, b) => porFam[b.id].reduce((x, y) => x + y) - porFam[a.id].reduce((x, y) => x + y)).map(f => {
    const v = porFam[f.id], tot = v[0] + v[1] + v[2];
    return `<div class="hbar"><span>${esc(f.nome)}</span><div class="track" style="width:${(tot / max) * 100}%">
      ${v.map((n, i) => n ? `<span data-tip="${esc(f.nome)} · ${nomes[i]}: ${n}" style="flex:${n};background:var(--s${i + 1})"></span>` : "").join("")}</div><span class="tot">${tot}</span></div>`;
  }).join("");
  return `<div class="screen-head"><h1>Painel</h1><p>Retrato da fila e da aderência à programação de ${fmtData(S.data)}.</p></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${pend.toLocaleString("pt-BR")}</div><div class="k">testes pendentes</div></div>
      <div class="kpi"><div class="v">${lotesFila}</div><div class="k">lotes na fila</div></div>
      <div class="kpi"><div class="v">${criticos}</div><div class="k">lotes Crítico DDE ou PV na fila</div></div>
      <div class="kpi"><div class="v">${hoje.length}</div><div class="k">itens programados no dia</div></div>
      <div class="kpi"><div class="v">${hoje.length ? Math.round((feito / hoje.length) * 100) + "%" : "—"}</div><div class="k">aderência (feito ÷ programado)</div></div>
      <div class="kpi"><div class="v">${hoje.length - comRet.length}</div><div class="k">itens do dia sem retorno</div></div>
    </div>
    <div class="grid2"><section class="viz"><h3>Testes pendentes por família</h3>
      <div class="legend">${nomes.map((n, i) => `<span><i style="background:var(--s${i + 1})"></i>${n}</span>`).join("")}</div>${barras}</section>
      <section class="viz"><h3>Motivos de "não feito"</h3><p class="muted" style="margin:4px 0 12px">Todos os dias registrados neste navegador.</p>
      ${Object.keys(motivos).length ? `<div class="tbl-wrap"><table><thead><tr><th>Motivo</th><th>Itens</th></tr></thead><tbody>${Object.entries(motivos).sort((a, b) => b[1] - a[1]).map(([m, n]) => `<tr><td>${esc(m)}</td><td class="num">${n}</td></tr>`).join("")}</tbody></table></div>`
        : '<div class="empty">Nenhum "não feito" registrado ainda. Use a tela Meu turno.</div>'}</section></div>`;
}

    <p class="hint">No app real este histórico vem da tabela de itens de programação e mostra também cada mudança de status, com quem e quando.</p></aside>`;

/* ---------- ações ---------- */
function programar() {
  const analista = $("#p-analista").value, equip = $("#p-equip").value;
  for (const ref of UI.sel) S.itens.push({ id: S.prox++, data: S.data, turno: S.turno, tipo: ref.startsWith("p|") ? "P" : "A", ref, analista, equip, ret: "", motivo: "", origem: "programador" });
  const n = UI.sel.size; UI.sel.clear(); salvar(); render();
  toast(`${n} ${n === 1 ? "item programado" : "itens programados"} para o ${S.turno}º turno`);
}
function retorno(id, r) {
  const it = S.itens.find(i => i.id === id); if (!it) return;
  const antes = it.ret;
  it.ret = it.ret === r ? "" : r;
  if (it.ret !== "Não feito") it.motivo = "";
  const [nd, nt] = proximo(it.data, it.turno);
  const filho = S.itens.findIndex(i => i.pai === it.id);
  if (antes === "Continuidade" && filho >= 0 && it.ret !== "Continuidade") S.itens.splice(filho, 1);
  if (it.ret === "Continuidade" && filho < 0) {
    S.itens.push({ id: S.prox++, pai: it.id, data: nd, turno: nt, tipo: it.tipo, ref: it.ref, analista: "", equip: it.equip, ret: "", motivo: "", origem: "continuidade" });
    toast(`Continuidade enviada para o ${nt}º turno de ${fmtData(nd)}`);
  }
  salvar(); render();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-acao]"); if (!b) return;
  if (b.dataset.turno) { S.turno = Number(b.dataset.turno); UI.sel.clear(); salvar(); render(); }
  else if (b.dataset.tela) { UI.tela = b.dataset.tela; render(); $("#main").scrollTop = 0; }
  else if (b.dataset.fam) { UI.fam = b.dataset.fam; render(); }
  else if (b.dataset.chip) { const r = b.dataset.chip; UI.sel.has(r) ? UI.sel.delete(r) : UI.sel.add(r); render(); }
  else if (b.dataset.desmarcar) { UI.sel.delete(b.dataset.desmarcar); render(); }
  else if (b.dataset.lote) { abrirLote(Number(b.dataset.lote)); }
  else if (b.dataset.ret) { retorno(Number(b.dataset.item), b.dataset.ret); }
  else if (b.dataset.acao === "programar") programar();
  else if (b.dataset.acao === "limpar") { UI.sel.clear(); render(); }
  else if (b.dataset.acao === "mais") { UI.limite[UI.fam] = (UI.limite[UI.fam] || 25) + 25; render(); }
  else if (b.dataset.acao === "fechar") { $("#overlay").innerHTML = ""; }
  else if (b.dataset.acao === "reset") {
    if (b.dataset.confirma) { S = estadoInicial(); UI.sel.clear(); salvar(); render(); toast("Dados da planilha restaurados"); }
    else { b.dataset.confirma = "1"; b.textContent = "Toque de novo para confirmar"; setTimeout(() => { if (b.isConnected) { delete b.dataset.confirma; b.textContent = "Voltar aos dados da planilha"; } }, 4000); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "f-data" && t.value) { S.data = t.value; UI.sel.clear(); salvar(); render(); }
  else if (t.id === "f-cluster") { UI.cluster = t.value; render(); }
  else if (t.id === "f-conc") { UI.verConcluidos = t.checked; render(); }
  else if (t.id === "f-famq") { UI.famQuadro = t.value; render(); }
  else if (t.id === "f-fame") { UI.famEquip = t.value; render(); }
  else if (t.id === "f-meu") { UI.analistaMeu = t.value; render(); }
  else if (t.dataset.status) { S.status[t.dataset.status] = t.value; salvar(); render(); toast("Status atualizado"); }
  else if (t.dataset.motivo) { const it = S.itens.find(i => i.id === Number(t.dataset.motivo)); it.motivo = t.value; salvar(); render(); }
  else if (t.dataset.atribuir) { const it = S.itens.find(i => i.id === Number(t.dataset.atribuir)); it.analista = t.value; salvar(); render(); }
});
let buscaTimer;
document.addEventListener("input", e => {
  if (e.target.id !== "f-busca") return;
  clearTimeout(buscaTimer);
  buscaTimer = setTimeout(() => { UI.busca = e.target.value; render(); const i = $("#f-busca"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250);
});
document.addEventListener("submit", e => {
  if (e.target.id !== "f-recado") return;
  e.preventDefault();
  const texto = $("#r-texto").value.trim(); if (!texto) return;
  S.recados.push({ id: Date.now(), data: S.data, turno: S.turno, fam: $("#r-fam").value, texto, quem: "Programador" });
  salvar(); render(); toast("Recado registrado");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#overlay").innerHTML = ""; });
const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; document.body.appendChild(tip);
document.addEventListener("pointermove", e => {
  const el = e.target.closest("[data-tip]");
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 270) + "px"; tip.style.top = (e.clientY + 14) + "px";
});

render();
</script>
